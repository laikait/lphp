name: Dependency security audit

on:
  push:
    branches:
      - beta
      - main
  pull_request:
  # Advisories are published against code that has not changed, so a quiet
  # repository still needs checking.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  Audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2

      # What a deployment installs. A known advisory here fails the build: it
      # is code that runs in production. --locked audits composer.lock, the
      # exact versions installed, not whatever composer.json would resolve to today.
      - name: Audit production dependencies
        run: composer audit --locked --no-dev

      # Development tools (PHPUnit, PHPStan, PHP-CS-Fixer) never reach a
      # deployment, so an advisory in one is reported without failing the build.
      # It still shows up in the log, and Dependabot proposes the update.
      - name: Audit development dependencies
        continue-on-error: true
        run: composer audit --locked
