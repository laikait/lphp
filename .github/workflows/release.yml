name: LPHP Version Release

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:

jobs:
  ########################################################
  # BUILD & RELEASE
  ########################################################
  release:
    name: LPHP Build & Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      ARTIFACT: lphp-${{ github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # git archive needs the tag itself, not only the commit.
          fetch-depth: 0

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir || echo ~/.composer/cache)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          # Only Composer's download cache. Caching "vendor" too would pin the
          # resolved dependency versions across runs, and this repo ships no
          # composer.lock, so a restored vendor/ silently overrides resolution.
          path: ${{ steps.composer-cache.outputs.dir }}
          # Keyed on composer.json: with no composer.lock in this repo,
          # hashFiles('**/composer.lock') is an empty string and the key never
          # changes.
          key: ${{ runner.os }}-composer-v2-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-v2-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.2
          tools: composer

      - name: Install dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-progress

      # What applications update from (docs/operations/updating.md): the
      # repository at this tag as git archive exports it -- .gitattributes
      # decides what ships, and vendor/ never does -- plus framework.json,
      # which records every file's hash and whose it is.
      - name: Check the version matches the tag
        run: |
          version=$(php -r 'require "vendor/autoload.php"; echo App\Engine\Core\Application::VERSION;')
          test "v$version" = "${{ github.ref_name }}" || { echo "Application::VERSION is $version, the tag is ${{ github.ref_name }}"; exit 1; }
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "ARTIFACT=lphp-${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Build the release archive and its manifest
        run: |
          mkdir -p build/lphp
          git archive "${{ github.ref_name }}" | tar -x -C build/lphp
          php laika framework:manifest --from=build/lphp --release="$VERSION" --write=build/lphp/framework.json
          cp build/lphp/framework.json framework.json
          (cd build && zip -qr "../$ARTIFACT.zip" lphp)

      - name: Generate artifact checksum
        run: sha256sum "$ARTIFACT.zip" > "$ARTIFACT.zip.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            ${{ env.ARTIFACT }}.zip
            ${{ env.ARTIFACT }}.zip.sha256
            framework.json
          retention-days: 30

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: false
          overwrite_files: true
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            🚀 **${{ github.ref_name }} Release**

            **Tag:** ${{ github.ref_name }}
            **Commit:** ${{ github.sha }}
            **Build #:** ${{ github.run_number }}

            **Artifacts:**
            - `${{ env.ARTIFACT }}.zip` — the framework at this tag
            - `${{ env.ARTIFACT }}.zip.sha256`
            - `framework.json` — the release manifest

            Update an application with `php laika framework:update`.
          files: |
            ${{ env.ARTIFACT }}.zip
            ${{ env.ARTIFACT }}.zip.sha256
            framework.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}