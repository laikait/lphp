name: PHP Compatibility Check

on:
  push:
    branches:
      - beta
  pull_request:

permissions:
  contents: read

jobs:
  # The full gate. Linux is deliberate: it is the only place the case-sensitive
  # PSR-4 mapping of modules/ is actually enforced, and Windows will never catch
  # a casing mistake.
  Gate:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl and posix: the system tests that send and ignore signals run
          # only with them, and would otherwise skip without anybody noticing.
          extensions: intl, json, mbstring, pdo, pdo_sqlite, fileinfo, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda #v4

      - name: Coding standard
        run: composer run cs

      # phpstan.neon pins the analysed range to 8.2-8.5, so this step is also
      # where syntax newer than 8.2 is caught -- on every version in the
      # matrix, not just the oldest one.
      - name: Static analysis
        run: composer run stan

      - name: Tests
        run: composer run test

      # Informational, on one version, and never a failure. A shared runner's
      # timings move by a third between runs, so a threshold here would fail
      # builds at random and teach everybody to ignore it. What must never
      # regress -- an asset request loading no module, a warmed boot walking no
      # directory -- is asserted exactly in the test step above. This prints the
      # numbers into the log so a change that made something ten times slower
      # is visible to whoever reads it, and --compare on one machine does the rest.
      - name: Benchmarks
        if: matrix.php == '8.4'
        continue-on-error: true
        run: php -d opcache.enable_cli=1 tests/Benchmark/run.php --rounds=5

  # composer.json says the framework runs on ^8.2. This job is what makes that
  # a claim about the FRAMEWORK rather than about its test suite.
  #
  # --no-dev on purpose: a deployment installs no dev dependencies, so this is
  # the dependency set a real 8.2 host would have. It cannot run PHPUnit, and it
  # does not need to -- what is in question here is whether the shipped code
  # parses and boots on the oldest supported runtime, and every line of it is
  # either linted or executed below.
  Runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2
        with:
          php-version: '8.2'
          extensions: intl, json, mbstring, pdo, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install runtime dependencies only
        run: composer install --no-dev --no-interaction --no-progress

      # Parsing is the failure mode that newer-than-8.2 syntax produces, and a parse
      # error in a file no request happens to reach is still a broken release.
      - name: Lint every shipped file
        run: |
          find engine modules -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null
          php -l public/index.php
          php -l server
          php -l laika

      # Booting exercises what linting cannot: the container, the module
      # discovery walk, and every engine subsystem that Bootstrap wires up.
      - name: Boot the framework
        run: |
          php laika about
          php laika module:list
          php laika route:list
          php laika schedule:list
          php laika config:list

      # And real requests through the HTTP kernel, because a console run never
      # touches the router or the dispatcher. Both default pages are Twig, so
      # this is also the proof that Twig arrives with --no-dev: left in
      # require-dev, the front page would be a 500 here and nowhere else.
      - name: Serve the default pages
        run: |
          php -S 127.0.0.1:8080 -t public server &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8080/ > /dev/null && break
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:8080/ | grep -q 'Your application is running'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/no/such/page)" = 404
          curl -s http://127.0.0.1:8080/no/such/page | grep -q 'That page is not here'

  # Every dialect on the database it is written for. The Gate job proves the
  # SQL each grammar writes as text, and runs it on SQLite; SQLite agreeing
  # proves nothing about the other three, so here they each run it themselves.
  # TestDatabases turns a DB_TEST_*_DSN variable into a connection, and a
  # server named there that cannot be reached fails rather than skips.
  Databases:
    # Pinned, not ubuntu-latest: SQL Server's ODBC driver comes from
    # Microsoft's package repository, which is published per Ubuntu release
    # and may lag behind a new one.
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laika_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20

      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: laika_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20

      sqlsrv:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Laika-Test-2026
        ports: ['1433:1433']
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Laika-Test-2026 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      DB_TEST_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=laika_test;charset=utf8mb4'
      DB_TEST_MYSQL_USERNAME: root
      DB_TEST_MYSQL_PASSWORD: root
      DB_TEST_PGSQL_DSN: 'pgsql:host=127.0.0.1;port=5432;dbname=laika_test'
      DB_TEST_PGSQL_USERNAME: postgres
      DB_TEST_PGSQL_PASSWORD: postgres
      # tempdb: a scratch database every SQL Server has. The ODBC 18 driver
      # encrypts by default, and the container's certificate is self-signed.
      DB_TEST_SQLSRV_DSN: 'sqlsrv:Server=127.0.0.1,1433;Database=tempdb;TrustServerCertificate=1'
      DB_TEST_SQLSRV_USERNAME: sa
      DB_TEST_SQLSRV_PASSWORD: Laika-Test-2026

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1

      # pdo_sqlsrv is only the PHP half. It talks to SQL Server through
      # Microsoft's ODBC driver, which the runner image does not ship.
      - name: Install the ODBC driver for SQL Server
        run: |
          curl -sSL -o /tmp/packages-microsoft-prod.deb \
            "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo "$VERSION_ID")/packages-microsoft-prod.deb"
          sudo dpkg -i /tmp/packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #v2
        with:
          php-version: '8.3'
          extensions: intl, json, mbstring, pdo, pdo_sqlite, pdo_mysql, pdo_pgsql, sqlsrv, pdo_sqlsrv, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda #v4

      - name: Database tests on every server
        run: vendor/bin/phpunit tests/Unit/Database
